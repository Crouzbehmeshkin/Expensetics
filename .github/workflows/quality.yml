name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install verified development dependencies
        run: python -m pip install --require-hashes -r requirements/dev.lock
      - name: Install browser
        run: python -m playwright install chromium
      - name: Compile
        run: python -m compileall -q finance_app tests
      - name: Unit tests and coverage
        run: python -m pytest -m "not e2e" --cov=finance_app --cov-report=term-missing
      - name: Browser test
        run: python -m pytest -m e2e
      - name: Dependency audit
        run: |
          python -m pip_audit --strict --disable-pip --require-hashes -r requirements/runtime.lock
          python -m pip_audit --strict --disable-pip --require-hashes -r requirements/dev.lock
          python -m pip_audit --strict --disable-pip --require-hashes -r requirements/build.lock
          python -m pip_audit --strict --disable-pip --require-hashes -r requirements/tools.lock
